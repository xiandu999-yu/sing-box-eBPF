name: Build

# 从 assemble-source 产出的源码包编译：
#   * CLI 二进制压缩包：仅 Linux（eBPF 只在 Linux 上可用）
#   * OpenWrt 安装包：.ipk / .apk
#
# 流程分两段：
#   prepare —— 下载 sing-box-src release 里的源码包，取 sing-box/src 打成 prepared-src
#   build   —— 下载 prepared-src 直接编译
#
# 补丁、sing-ebpf 模块、预编译 eBPF 对象都已经封在那份源码包里：
#   .github/workflows/assemble-source.yml 负责组装，固定点见 ci/pins.env。
# 补丁说明见 patches/CHANGES.md。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号覆盖（留空则按固定 commit 的 git tag 推导）"
        required: false
        default: ""
      extra_tags:
        description: "额外 Go 编译标签，逗号分隔"
        required: false
        default: ""
      with_ebpf:
        description: "Linux 构建追加 with_ebpf 标签"
        type: boolean
        default: true
      release:
        description: "构建完成后创建 draft release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      repository: ${{ steps.pin.outputs.repository }}
      commit: ${{ steps.pin.outputs.commit }}
      pinned_version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Read ci/pins.env
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # tr -d '\r' 防止在 Windows 上编辑过该文件后带进 CRLF
          source <(tr -d '\r' < ./ci/pins.env)
          set +a
          for name in SING_BOX_REPOSITORY SING_BOX_COMMIT SING_BOX_VERSION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::ci/pins.env is missing ${name}"
              exit 1
            fi
          done
          if ! [[ "${SING_BOX_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SING_BOX_COMMIT must be a full 40-character commit SHA"
            exit 1
          fi
          {
            echo "repository=${SING_BOX_REPOSITORY}"
            echo "commit=${SING_BOX_COMMIT}"
            echo "version=${SING_BOX_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          override="${{ inputs.version }}"
          pinned="${{ steps.pin.outputs.version }}"
          raw="${override:-${pinned}}"
          raw="${raw#v}"
          [ -n "${raw}" ] || { echo "::error::no version: set SING_BOX_VERSION in ci/pins.env"; exit 1; }
          # 和上游一样只用「发布版本」：数字主干 + 标准预发布后缀。
          # fork 的 -reF1nd / -mod 这类装饰性后缀会丢掉，否则 apk 打包会因为
          # 版本语法不合法而失败（apk 只认 1.2.3、1.2.3_alpha1、1.2.3-r1）。
          core="$(printf '%s' "${raw}" | sed -E 's/^([0-9]+(\.[0-9]+)*).*/\1/')"
          pre="$(printf '%s' "${raw}" | sed -nE 's/^[0-9]+(\.[0-9]+)*-((alpha|beta|pre|rc)[.-]?[0-9]*).*/\2/p')"
          if [ -n "${pre}" ]; then
            version="${core}-${pre}"
          else
            version="${core}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building ${version}"

      - name: Write build info
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sing-box (CHIZI-0618 eBPF fork)"
            echo "repository:  ${{ steps.pin.outputs.repository }}"
            echo "commit:      ${{ steps.pin.outputs.commit }}"
            echo "version:     ${{ steps.resolve.outputs.version }}"
            echo "built at:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "patches:"
            mapfile -t patch_files < <(find patches -type f \( -name '*.patch' -o -name '*.diff' \) 2>/dev/null | sort)
            if [ ${#patch_files[@]} -eq 0 ]; then
              echo "  (none)"
            else
              printf '  - %s\n' "${patch_files[@]}"
            fi
            echo
            echo "patch sha256:"
            if [ ${#patch_files[@]} -gt 0 ]; then
              sha256sum "${patch_files[@]}" | sed 's/^/  /'
            fi
          } > build-info.txt
          cat build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v6
        with:
          name: build-info
          path: build-info.txt
          retention-days: 7

  # 唯一的「准备」阶段：取 assemble-source 产出的源码包，供后续 job 复用。
  # 补丁、模块、预编译对象都已经在那份 tarball 里，这里不再打补丁。
  prepare:
    name: Prepare source
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs:
      - version
    steps:
      - uses: actions/checkout@v6

      - name: Download assembled source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball=$(sed -n 's/^PKG_SOURCE:=//p' OpenWrt/sing-box/Makefile)
          [ -n "${tarball}" ] || { echo "::error::PKG_SOURCE is empty in OpenWrt/sing-box/Makefile"; exit 1; }
          echo "tarball: ${tarball}"
          gh release download sing-box-src --repo "${{ github.repository }}" \
            --pattern "${tarball}" --dir .
          tar -xzf "${tarball}"
          [ -d sing-box/src ] || { echo "::error::sing-box/src missing in ${tarball}"; exit 1; }
          tar -czf prepared-src.tgz -C sing-box src
          ls -lh prepared-src.tgz

      - name: Upload prepared source
        uses: actions/upload-artifact@v6
        with:
          name: prepared-src
          path: prepared-src.tgz
          retention-days: 7
          compression-level: 0

  test:
    name: Delivery tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs:
      - prepare
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v6
        with:
          name: prepared-src
          path: ${{ github.workspace }}

      - name: Extract
        shell: bash
        run: tar -xzf prepared-src.tgz

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # 模块现在通过 go.mod replace 引用（位于模块缓存），不再是本地目录。
      # 需要 root：建一次 sb-netkit-* 再删掉。
      - name: Delivery integration tests
        shell: bash
        working-directory: ${{ github.workspace }}/src
        run: |
          sudo env "PATH=$PATH" GOCACHE=/tmp/go-cache \
            go test -tags "with_ebpf ebpf_integration" \
            github.com/CHIZI-0618/sing-ebpf/runtime -run 'ProbeDelivery' -v

  build-linux:
    name: Linux ${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}${{ matrix.go386 && format('_{0}', matrix.go386) }}${{ matrix.gomips && format('_{0}', matrix.gomips) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs:
      - version
      - prepare
    defaults:
      run:
        working-directory: src
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          # goarch 在每行内唯一（产物名由它推导）；openwrt 列列出该二进制要
          # 额外打成哪些 OpenWrt 架构的安装包。
          - { goarch: amd64, openwrt: "x86_64" }
          - { goarch: arm64, openwrt: "aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic" }
          - { goarch: "386", go386: sse2, openwrt: "i386_pentium4" }
          - { goarch: arm, goarm: "7", openwrt: "arm_cortex-a5_vfpv4 arm_cortex-a7_neon-vfpv4 arm_cortex-a7_vfpv4 arm_cortex-a8_vfpv3 arm_cortex-a9_neon arm_cortex-a9_vfpv3-d16 arm_cortex-a15_neon-vfpv4" }
          - { goarch: riscv64, openwrt: "riscv64_generic" }
          - { goarch: loong64, openwrt: "loongarch64_generic" }
          - { goarch: mipsle, gomips: softfloat, openwrt: "mipsel_24kc mipsel_74kc mipsel_mips32" }
          - { goarch: mipsle, gomips: hardfloat, openwrt: "mipsel_24kc_24kf" }
          - { goarch: mips, gomips: softfloat, openwrt: "mips_24kc mips_4kec mips_mips32" }
          - { goarch: mips64, gomips: softfloat, openwrt: "mips64_mips64r2 mips64_octeonplus" }
          - { goarch: mips64le, gomips: softfloat, openwrt: "mips64el_mips64r2" }
          - { goarch: mips64le, gomips: hardfloat }
          - { goarch: "386", go386: softfloat, openwrt: "i386_pentium-mmx" }
          - { goarch: arm, goarm: "5", openwrt: "arm_arm926ej-s arm_cortex-a7 arm_cortex-a9 arm_fa526 arm_xscale" }
          - { goarch: arm, goarm: "6", openwrt: "arm_arm1176jzf-s_vfp" }
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v6
        with:
          name: prepared-src
          path: ${{ github.workspace }}

      - name: Extract
        shell: bash
        working-directory: ${{ github.workspace }}
        run: tar -xzf prepared-src.tgz

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # 构建前打印模块 pin，确认用的是 fork 的那个 commit
      - name: Show module pin
        run: |
          set -euo pipefail
          grep -n 'CHIZI-0618/sing-ebpf' go.mod || true
          go mod download github.com/CHIZI-0618/sing-ebpf
          go list -m -f '{{.Path}} {{.Version}}' github.com/CHIZI-0618/sing-ebpf
          go clean -cache

      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist

          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          if [ "${{ inputs.with_ebpf }}" != "false" ]; then
            TAGS="${TAGS},with_ebpf"
          fi
          if [ -n "${{ inputs.extra_tags }}" ]; then
            TAGS="${TAGS},${{ inputs.extra_tags }}"
          fi
          echo "BUILD_TAGS=${TAGS}"

          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.version.outputs.version }}' $(cat release/LDFLAGS) -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}

      - name: Record binary hash
        run: |
          set -euo pipefail
          ls -l dist/sing-box
          sha256sum dist/sing-box

      - name: Set names
        run: |
          set -xeuo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          DIR_NAME="sing-box-${VERSION}-linux-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            DIR_NAME="${DIR_NAME}v${{ matrix.goarm }}"
          elif [ -n "${{ matrix.go386 }}" ] && [ "${{ matrix.go386 }}" != "sse2" ]; then
            DIR_NAME="${DIR_NAME}-${{ matrix.go386 }}"
          elif [ -n "${{ matrix.gomips }}" ] && [ "${{ matrix.gomips }}" != "hardfloat" ]; then
            DIR_NAME="${DIR_NAME}-${{ matrix.gomips }}"
          fi
          echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"
          echo "PKG_VERSION=${VERSION//-/\~}" >> "${GITHUB_ENV}"

      - name: Package OpenWrt ipk
        if: ${{ matrix.openwrt != '' }}
        run: |
          set -xeuo pipefail
          sudo gem install --no-document fpm
          cp .fpm_openwrt .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/openwrt.deb" \
            --architecture all \
            dist/sing-box=/usr/bin/sing-box
          for architecture in ${{ matrix.openwrt }}; do
            .github/deb2ipk.sh "$architecture" "dist/openwrt.deb" \
              "dist/sing-box_${{ needs.version.outputs.version }}_openwrt_${architecture}.ipk"
          done
          rm "dist/openwrt.deb"

      - name: Install apk-tools
        if: ${{ matrix.openwrt != '' }}
        run: |
          set -xeuo pipefail
          docker run --rm -v /usr/local/bin:/mnt alpine:edge \
            sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"

      - name: Package OpenWrt apk
        if: ${{ matrix.openwrt != '' }}
        run: |
          set -xeuo pipefail
          for architecture in ${{ matrix.openwrt }}; do
            .github/build_openwrt_apk.sh \
              "$architecture" \
              "${{ needs.version.outputs.version }}" \
              "dist/sing-box" \
              "dist/sing-box_${{ needs.version.outputs.version }}_openwrt_${architecture}.apk"
          done

      - name: Archive
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}" sing-box

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binary-linux-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}${{ matrix.go386 && format('_{0}', matrix.go386) }}${{ matrix.gomips && format('_{0}', matrix.gomips) }}
          path: src/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish release
    if: ${{ github.event_name == 'push' || inputs.release }}
    runs-on: ubuntu-26.04
    needs:
      - version
      - build-linux
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Download build info
        uses: actions/download-artifact@v6
        with:
          name: build-info
          path: dist

      - name: List artifacts
        run: ls -lh dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          name: sing-box ${{ needs.version.outputs.version }}
          body: |
            Built from `${{ needs.version.outputs.repository }}` at `${{ needs.version.outputs.commit }}`.

            Version: `${{ needs.version.outputs.version }}`
          draft: true
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: false
