name: Assemble sing-box source

# 把 sing-box 固定点 + sing-ebpf 模块 + 两份补丁组装成一个源码 tarball，
# 发布到 sing-box-src release，并把 PKG_SOURCE / PKG_HASH 写回
# OpenWrt/sing-box/Makefile。OpenWrt 侧只消费这份 tarball。
on:
  workflow_dispatch:

concurrency:
  group: assemble-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load pins
        run: grep -E '^[A-Z]' ci/pins.env | tr -d '\r' >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      # eBPF 对象必须用 NDK r29 的 Clang 21 生成（模块 Makefile 有版本硬校验）
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Assemble source tree
        run: |
          set -eux
          OUT="sing-box"
          rm -rf "$OUT"; mkdir -p "$OUT"

          fetch_at() {
            git clone -q --filter=blob:none --no-checkout "$1" "$2"
            git -C "$2" checkout -q "$3"
          }

          fetch_at "https://github.com/${SING_BOX_REPOSITORY}" "$OUT/src" "$SING_BOX_COMMIT"
          fetch_at "https://github.com/${MODULE_REPOSITORY}" "$OUT/module" "$MODULE_COMMIT"

          # sing-box 补丁（delivery 选项、TCX、clashapi 进程名）
          if ls patches/sing-box/*.patch >/dev/null 2>&1; then
            git -C "$OUT/src" apply --whitespace=nowarn "$GITHUB_WORKSPACE"/patches/sing-box/*.patch
          fi

          # 模块补丁（pname 旁路、delivery、TCX）
          if ls patches/modules/sing-ebpf/*.patch >/dev/null 2>&1; then
            git -C "$OUT/module" apply --whitespace=nowarn "$GITHUB_WORKSPACE"/patches/modules/sing-ebpf/*.patch
          fi

          # C 改过就要重生成对象：补丁里不带二进制，对象在这里现生成
          ( cd "$OUT/module" \
              && ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}" make generate )

          ( cd "$OUT/src" \
              && go mod edit -replace "${MODULE_PATH}=../module" \
              && go mod tidy )

          # 用源码 commit 的时间做可复现时间戳：版本号不一定是 YYYY-MM-DD 形式
          SOURCE_DATE_EPOCH=$(git -C "$OUT/src" log -1 --format=%ct)
          export SOURCE_DATE_EPOCH

          find "$OUT" -name .git -type d -prune -exec rm -rf {} +

          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --numeric-owner --owner=0 --group=0 -cf src.tmp.tar "$OUT"
          gzip -n -9 src.tmp.tar
          # 内容寻址：同样输入得到同样名字，不同内容不会覆盖旧资产
          SRC_ID=$(sha256sum src.tmp.tar.gz | cut -c1-12)
          TARBALL="sing-box-src-${SING_BOX_VERSION}-${SRC_ID}.tar.gz"
          mv src.tmp.tar.gz "$TARBALL"
          echo "PKG_HASH=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "SRC_ID=$SRC_ID" >> "$GITHUB_ENV"

      # 补丁是行级 diff：上游把函数或字段挪走之后，补丁可能照样"应用成功"，
      # 但改动落在没人调用的位置，编译不报错、运行时静默失效。
      # 这里逐个确认关键改动还贴在真正生效的代码上，再去打包发布。
      - name: Verify patch anchors
        run: |
          set -eu
          cd sing-box/src
          fail() { echo "::error::$1"; exit 1; }

          grep -qs 'BypassProcess: i.localBypassProcess' protocol/ebpf/lifecycle_resources.go \
            || fail "bypass_process 没有传进 CgroupConfig，cgroup 数据面会代理所有进程"
          grep -qs 'json:"bypass_process,omitempty"' option/ebpf.go \
            || fail "bypass_process 配置项不见了"
          grep -qs 'i.startProcessMarkers()' protocol/ebpf/lifecycle_start.go \
            || fail "socket_assign 的 marker-only 钩子没有启动"
          grep -Eqs 'Delivery: +i\.delivery' protocol/ebpf/lifecycle_start.go \
            || fail "delivery/tcx_* 没有传进 TCConfig"
          grep -qs 'processName = filepath.Base(processPath)' experimental/clashapi/connections.go \
            || fail "clashapi 进程名字段不见了"
          grep -qs 'eBPF TCP ' protocol/ebpf/inbound_connection.go \
            || fail "cgroup 侧的 TCP INFO 日志不见了"
          grep -qs 'eBPF TCP ' protocol/ebpf/tc_connection.go \
            || fail "socket_assign 侧的 TCP INFO 日志不见了"

          # tc_repair 探针缝在 repairTCInfrastructure 里；上游把它挪走就必须重做补丁。
          anchor=$(grep -rls 'func (i \*Inbound) repairTCInfrastructure' protocol/ebpf | head -n 1)
          [ -n "$anchor" ] || fail "找不到 repairTCInfrastructure，TC 修复逻辑已改结构"
          grep -qs 'tc_repair' "$anchor" \
            || fail "tc_repair 探针不在 $anchor 里了，补丁落点已失效"
          echo "all anchors ok"

      - name: Publish to sing-box-src release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view sing-box-src --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create sing-box-src --repo "${{ github.repository }}" \
              --title "sing-box pinned source" \
              --notes "组装好的 sing-box + sing-ebpf 源码包；内容寻址，旧资产不会被覆盖。" \
              --latest=false
          if gh release view sing-box-src --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' | grep -qx "$TARBALL"; then
            echo "asset already present: $TARBALL"
          else
            gh release upload sing-box-src "$TARBALL" --repo "${{ github.repository }}"
          fi

      - name: Write PKG_SOURCE into Makefile and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          MK=OpenWrt/sing-box/Makefile
          cur_ver=$(sed -n 's/^PKG_VERSION:=//p' "$MK")
          cur_rel=$(sed -n 's/^PKG_RELEASE:=//p' "$MK")
          if [ "$cur_ver" = "${SING_BOX_VERSION}" ] && grep -qx "PKG_SOURCE:=${TARBALL}" "$MK"; then
            echo "no change"; exit 0
          fi
          if [ "$cur_ver" = "${SING_BOX_VERSION}" ]; then
            rel=$((cur_rel + 1))
          else
            rel=1
          fi
          sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=${SING_BOX_VERSION}|" "$MK"
          sed -i "s|^PKG_RELEASE:=.*|PKG_RELEASE:=${rel}|" "$MK"
          sed -i "s|^PKG_SOURCE:=.*|PKG_SOURCE:=${TARBALL}|" "$MK"
          sed -i "s|^PKG_HASH:=.*|PKG_HASH:=${PKG_HASH}|" "$MK"
          git config user.email ci@local
          git config user.name ci
          git add "$MK"
          git commit -m "chore(source): sing-box ${SING_BOX_VERSION} ${SRC_ID}"
          git push
