name: Generate BPF objects

# 为 sing-ebpf 模块生成 BPF 对象（bpfel/bpfeb）。
# 输出 Artifacts: bpfgen —— 下载后把 internal/bpfgen/* 提交回模块仓库即可。
#
# 需要 NDK r29 Clang 21，这里用 setup-ndk 提供。

on:
  workflow_dispatch:
    inputs:
      module_ref:
        description: "sing-ebpf 分支/标签/commit"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  generate:
    name: Generate objects
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sing-ebpf
        uses: actions/checkout@v6
        with:
          repository: xiandu999-yu/sing-ebpf
          ref: ${{ inputs.module_ref }}
          path: module
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: module/go.mod
          cache: true
          cache-dependency-path: module/go.sum

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Generate BPF objects
        working-directory: module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          before=$(sha256sum internal/bpfgen/tc_bpfel.o | cut -d' ' -f1)
          echo "before: ${before}"
          make generate
          after=$(sha256sum internal/bpfgen/tc_bpfel.o | cut -d' ' -f1)
          echo "after:  ${after}"
          git status --short -- internal/bpfgen || true

      - name: Upload generated objects
        uses: actions/upload-artifact@v6
        with:
          name: bpfgen
          path: module/internal/bpfgen
          if-no-files-found: error
          retention-days: 7
