name: Build sing-box (eBPF only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
      build:
        description: "Build type"
        required: true
        type: choice
        default: "All"
        options:
          - All
          - Binary
          - Android
          - Linux
          - publish-android
      test_message:
        description: "TestFlight test message"   # 保留但无实际用途
        required: false
        type: string
      build_ebpf:
        description: "Build eBPF-enabled binaries (manual override)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - stable
      - testing
      - unstable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false
      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-linux-
      - name: Cache Go tool builds
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-build-tools-linux-
      - name: Check input version
        if: github.event_name == 'workflow_dispatch'
        run: |-
          echo "version=${{ inputs.version }}"
          echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Calculate version
        if: github.event_name != 'workflow_dispatch'
        run: |-
          go run -v ./cmd/internal/read_tag --ci --nightly
      - name: Set outputs
        id: outputs
        run: |-
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ==================== 常规 Linux 二进制构建（使用当前仓库） ====================
  build:
    name: Build Linux binaries
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Linux'
    runs-on: ubuntu-26.04
    needs:
      - calculate_version
    strategy:
      max-parallel: 13
      matrix:
        # 完整 linux 矩阵（略，请参考之前提供的内容）
        include:
          - { os: linux, arch: amd64, variant: purego, naive: true }
          - { os: linux, arch: amd64, variant: glibc, naive: true }
          - { os: linux, arch: amd64, variant: musl, naive: true, debian: amd64, rpm: x86_64, pacman: x86_64, alpine: x86_64, openwrt: "x86_64" }
          - { os: linux, arch: arm64, variant: purego, naive: true }
          - { os: linux, arch: arm64, variant: glibc, naive: true }
          - { os: linux, arch: arm64, variant: musl, naive: true, debian: arm64, rpm: aarch64, pacman: aarch64, alpine: aarch64, openwrt: "aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic" }
          - { os: linux, arch: "386", go386: sse2 }
          - { os: linux, arch: "386", variant: glibc, naive: true, go386: sse2 }
          - { os: linux, arch: "386", variant: musl, naive: true, go386: sse2, debian: i386, rpm: i386, alpine: x86, openwrt: "i386_pentium4" }
          - { os: linux, arch: arm, goarm: "7" }
          - { os: linux, arch: arm, variant: glibc, naive: true, goarm: "7" }
          - { os: linux, arch: arm, variant: musl, naive: true, goarm: "7", debian: armhf, rpm: armv7hl, pacman: armv7hl, alpine: armv7, openwrt: "arm_cortex-a5_vfpv4 arm_cortex-a7_neon-vfpv4 arm_cortex-a7_vfpv4 arm_cortex-a8_vfpv3 arm_cortex-a9_neon arm_cortex-a9_vfpv3-d16 arm_cortex-a15_neon-vfpv4" }
          - { os: linux, arch: mipsle, gomips: hardfloat, naive: true, variant: glibc }
          - { os: linux, arch: mipsle, gomips: softfloat, naive: true, variant: musl, debian: mipsel, rpm: mipsel, openwrt: "mipsel_24kc mipsel_74kc mipsel_mips32" }
          - { os: linux, arch: mips64le, gomips: hardfloat, naive: true, variant: glibc, debian: mips64el, rpm: mips64el }
          - { os: linux, arch: riscv64, naive: true, variant: glibc }
          - { os: linux, arch: riscv64, naive: true, variant: musl, debian: riscv64, rpm: riscv64, alpine: riscv64, openwrt: "riscv64_generic" }
          - { os: linux, arch: loong64, naive: true, variant: glibc }
          - { os: linux, arch: loong64, naive: true, variant: musl, debian: loongarch64, rpm: loongarch64, alpine: loongarch64, openwrt: "loongarch64_generic" }
          - { os: linux, arch: "386", go386: softfloat, openwrt: "i386_pentium-mmx" }
          - { os: linux, arch: arm, goarm: "5", openwrt: "arm_arm926ej-s arm_cortex-a7 arm_cortex-a9 arm_fa526 arm_xscale" }
          - { os: linux, arch: arm, goarm: "6", debian: armel, rpm: armv6hl, openwrt: "arm_arm1176jzf-s_vfp" }
          - { os: linux, arch: mips, gomips: softfloat, openwrt: "mips_24kc mips_4kec mips_mips32" }
          - { os: linux, arch: mipsle, gomips: hardfloat, openwrt: "mipsel_24kc_24kf" }
          - { os: linux, arch: mipsle, gomips: softfloat }
          - { os: linux, arch: mips64, gomips: softfloat, openwrt: "mips64_mips64r2 mips64_octeonplus" }
          - { os: linux, arch: mips64le, gomips: hardfloat }
          - { os: linux, arch: mips64le, gomips: softfloat, openwrt: "mips64el_mips64r2" }
          - { os: linux, arch: s390x, debian: s390x, rpm: s390x }
          - { os: linux, arch: ppc64le, debian: ppc64el, rpm: ppc64le }
          - { os: linux, arch: riscv64 }
          - { os: linux, arch: loong64 }
    steps:
      # 此处为完整构建步骤（与之前一致），由于篇幅限制省略，但实际文件必须包含。
      # 内容与之前提供的 build Job 完全相同。
      # 请参考之前的回答中 build Job 的完整 steps（包含 cronet、构建、打包、签名等）。
      # 我将在最终文件中提供完整内容，此处仅为示意。

  # ==================== eBPF 构建（克隆外部仓库 reF1nd/sing-box） ====================
  build_ebpf:
    name: Build eBPF binaries (amd64 & arm64) from external repo
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_ebpf == true)
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    steps:
      # 1. 先 checkout 当前仓库（用于读取 ci/pins.env）
      - name: Checkout this repo (for pins.env)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1

      # 2. 加载 pins 环境变量（包含 SING_BOX_COMMIT 等）
      - name: Load pins
        run: |
          if [ -f ci/pins.env ]; then
            cat ci/pins.env | grep -E '^[A-Z]' >> "$GITHUB_ENV"
          else
            echo "Warning: ci/pins.env not found, using default commit?"
          fi

      # 3. 设置 Go（用统一版本）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false

      # 4. 克隆外部仓库并检出指定 commit
      - name: Clone external repo and checkout commit
        run: |
          set -eux
          # 克隆 CHIZI-0618/sing-box（不 checkout 工作树）
          git clone --filter=blob:none --no-checkout https://github.com/CHIZI-0618/sing-box repo
          # 检出由 pins.env 指定的 commit
          git -C repo checkout "$SING_BOX_COMMIT"
          # 初始化子模块（如果有）
          git -C repo submodule update --init --recursive || true

      # 5. 构建 eBPF 二进制（使用外部仓库的 make build）
      - name: Build eBPF binaries
        run: |
          set -eux
          VERSION="${{ needs.calculate_version.outputs.version }}"
          mkdir -p dist

          build_arch() {
            local arch=$1
            local output="dist/sing-box-${VERSION}-linux-${arch}"
            (
              cd repo
              # 读取外部仓库的默认标签（非 naive）并追加 with_ebpf
              BASE_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
              export TAGS="${BASE_TAGS},with_ebpf"
              export CGO_ENABLED=0
              export GOOS=linux
              export GOARCH="$arch"
              make build
            )
            # 移动产物并打包
            mv repo/sing-box "$output"
            tar -czf "${output}.tar.gz" -C dist "$(basename "$output")"
            rm "$output"
          }

          build_arch amd64
          build_arch arm64

      # 6. 上传到 sing-box-ebpf release（独立）
      - name: Upload to release (sing-box-ebpf)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sing-box-ebpf --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create sing-box-ebpf --repo "${{ github.repository }}" \
              --title "sing-box eBPF binaries" \
              --notes "Auto-built sing-box binaries (eBPF-enabled, amd64/arm64)." \
              --latest=false

          for file in dist/*.tar.gz; do
            gh release upload sing-box-ebpf "$file" --repo "${{ github.repository }}" --clobber
          done

          # 只保留最近 3 个 assets
          gh release view sing-box-ebpf --repo "${{ github.repository }}" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[3:] | .[].name' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete-asset sing-box-ebpf "$old" --repo "${{ github.repository }}" -y
              done

  # ==================== Android 库构建（使用当前仓库） ====================
  build_android_library:
    name: Build Android library (${{ matrix.go_arch }})
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build == 'All' || inputs.build == 'Android' || inputs.build == 'publish-android'))
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    strategy:
      fail-fast: false
      matrix:
        go_arch:
          - "386"
          - amd64
          - arm
          - arm64
    steps:
      # 完整步骤与之前相同，此处省略，实际应包含。
      # 参考之前提供的完整内容。

  # ==================== Android 客户端构建 ====================
  build_android:
    name: Build Android (${{ matrix.variant }})
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build == 'All' || inputs.build == 'Android'))
    runs-on: ubuntu-latest
    needs:
      - calculate_version
      - build_android_library
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: other
            task: :app:assembleOtherRelease
            output: app/build/outputs/apk/other/release/*.apk
          - variant: other-legacy
            task: :app:assembleOtherLegacyRelease
            output: app/build/outputs/apk/otherLegacy/release/*.apk
    steps:
      # 完整步骤与之前相同，此处省略。

  # ==================== 发布 Android 到 Google Play ====================
  publish_android:
    name: Publish Android
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'publish-android' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')
    runs-on: ubuntu-latest
    needs:
      - calculate_version
      - build_android_library
    steps:
      # 完整步骤与之前相同，此处省略。

  # ==================== 上传常规产物（Linux + Android APK）到版本 Release ====================
  upload:
    name: Upload builds
    if: "!failure() && github.event_name == 'workflow_dispatch' && (inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Android' || inputs.build == 'Linux')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - calculate_version
      - build
      - build_android
      # 注意：build_ebpf 不上传到版本 Release，所以不依赖
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Cache ghr
        uses: actions/cache@v4
        id: cache-ghr
        with:
          path: |
            ~/go/bin/ghr
          key: ghr
      - name: Setup ghr
        if: steps.cache-ghr.outputs.cache-hit != 'true'
        run: |
          cd $HOME
          git clone https://github.com/nekohasekai/ghr ghr
          cd ghr
          go install -v .
      - name: Set tag
        run: |
          git ls-remote --exit-code --tags origin v${{ needs.calculate_version.outputs.version }} || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag v${{ needs.calculate_version.outputs.version }} -f
          echo "VERSION=${{ needs.calculate_version.outputs.version }}" >> "$GITHUB_ENV"
      - name: Download artifacts (Linux + Android)
        uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: 'dist/**'
      - name: Upload builds
        if: ${{ env.PUBLISHED == 'false' }}
        run: |
          export PATH="$PATH:$HOME/go/bin"
          ghr --replace --draft --prerelease -p 5 "v${VERSION}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace builds
        if: ${{ env.PUBLISHED != 'false' }}
        run: |
          export PATH="$PATH:$HOME/go/bin"
          ghr --replace -p 5 "v${VERSION}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 缓存清理 ====================
  cache_gc:
    name: Cache GC
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    needs:
      - build
      - build_ebpf
      - build_android_library
      - build_android
      - upload
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .ref, .created_at, .last_accessed_at, .size_in_bytes, .key] | @tsv' > "$RUNNER_TEMP/caches.tsv"
          python3 - "$GITHUB_REPOSITORY" "$RUNNER_TEMP/caches.tsv" <<'EOF'
          import re
          import subprocess
          import sys

          repository, list_path = sys.argv[1], sys.argv[2]
          budget = 9 * 1024 * 1024 * 1024
          rows = []
          with open(list_path) as list_file:
              for line in list_file:
                  cache_id, ref, created_at, accessed_at, size, key = line.rstrip("\n").split("\t")
                  family = key
                  while True:
                      stripped = re.sub(r"-[0-9a-f]{16,}$", "", family)
                      if stripped == family:
                          break
                      family = stripped
                  rows.append({
                      "id": cache_id, "ref": ref, "created": created_at,
                      "accessed": accessed_at, "size": int(size), "key": key,
                      "family": family,
                  })
          newest = {}
          for row in rows:
              group = (row["ref"], row["family"])
              if group not in newest or row["created"] > newest[group]["created"]:
                  newest[group] = row
          doomed = [row for row in rows if newest[(row["ref"], row["family"])] is not row]
          kept = [row for row in rows if newest[(row["ref"], row["family"])] is row]
          total = sum(row["size"] for row in kept)
          for row in sorted(kept, key=lambda entry: entry["accessed"]):
              if total <= budget:
                  break
              doomed.append(row)
              total -= row["size"]
          for row in doomed:
              print(f"delete {row['size'] >> 20}MB {row['key']} ({row['ref']})")
              subprocess.run(
                  ["gh", "api", "-X", "DELETE", f"repos/{repository}/actions/caches/{row['id']}"],
                  check=False,
              )
          print(f"kept {len(rows) - len(doomed)} caches, {total >> 20}MB total")
          EOF
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build type"
        required: true
        type: choice
        default: "All"
        options:
          - All
          - Binary
          - Android
          - Linux
          - publish-android
      test_message:
        description: "TestFlight test message"   # 已废弃
        required: false
        type: string
      build_ebpf:
        description: "Build eBPF-enabled binaries (manual override)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - stable
      - testing
      - unstable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build }}
  cancel-in-progress: true

env:
  # 版本号将从 pins.env 加载，此处占位
  SING_BOX_VERSION: ""

jobs:
  # ==================== 常规 Linux 二进制构建 ====================
  build-linux:
    name: Build Linux binaries
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'All' || inputs.build == 'Binary' || inputs.build == 'Linux'
    runs-on: ubuntu-26.04
    strategy:
      max-parallel: 13
      matrix:
        include:
          - { os: linux, arch: amd64, variant: purego, naive: true }
          - { os: linux, arch: amd64, variant: glibc, naive: true }
          - { os: linux, arch: amd64, variant: musl, naive: true, debian: amd64, rpm: x86_64, pacman: x86_64, alpine: x86_64, openwrt: "x86_64" }
          - { os: linux, arch: arm64, variant: purego, naive: true }
          - { os: linux, arch: arm64, variant: glibc, naive: true }
          - { os: linux, arch: arm64, variant: musl, naive: true, debian: arm64, rpm: aarch64, pacman: aarch64, alpine: aarch64, openwrt: "aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic" }
          - { os: linux, arch: "386", go386: sse2 }
          - { os: linux, arch: "386", variant: glibc, naive: true, go386: sse2 }
          - { os: linux, arch: "386", variant: musl, naive: true, go386: sse2, debian: i386, rpm: i386, alpine: x86, openwrt: "i386_pentium4" }
          - { os: linux, arch: arm, goarm: "7" }
          - { os: linux, arch: arm, variant: glibc, naive: true, goarm: "7" }
          - { os: linux, arch: arm, variant: musl, naive: true, goarm: "7", debian: armhf, rpm: armv7hl, pacman: armv7hl, alpine: armv7, openwrt: "arm_cortex-a5_vfpv4 arm_cortex-a7_neon-vfpv4 arm_cortex-a7_vfpv4 arm_cortex-a8_vfpv3 arm_cortex-a9_neon arm_cortex-a9_vfpv3-d16 arm_cortex-a15_neon-vfpv4" }
          - { os: linux, arch: mipsle, gomips: hardfloat, naive: true, variant: glibc }
          - { os: linux, arch: mipsle, gomips: softfloat, naive: true, variant: musl, debian: mipsel, rpm: mipsel, openwrt: "mipsel_24kc mipsel_74kc mipsel_mips32" }
          - { os: linux, arch: mips64le, gomips: hardfloat, naive: true, variant: glibc, debian: mips64el, rpm: mips64el }
          - { os: linux, arch: riscv64, naive: true, variant: glibc }
          - { os: linux, arch: riscv64, naive: true, variant: musl, debian: riscv64, rpm: riscv64, alpine: riscv64, openwrt: "riscv64_generic" }
          - { os: linux, arch: loong64, naive: true, variant: glibc }
          - { os: linux, arch: loong64, naive: true, variant: musl, debian: loongarch64, rpm: loongarch64, alpine: loongarch64, openwrt: "loongarch64_generic" }
          - { os: linux, arch: "386", go386: softfloat, openwrt: "i386_pentium-mmx" }
          - { os: linux, arch: arm, goarm: "5", openwrt: "arm_arm926ej-s arm_cortex-a7 arm_cortex-a9 arm_fa526 arm_xscale" }
          - { os: linux, arch: arm, goarm: "6", debian: armel, rpm: armv6hl, openwrt: "arm_arm1176jzf-s_vfp" }
          - { os: linux, arch: mips, gomips: softfloat, openwrt: "mips_24kc mips_4kec mips_mips32" }
          - { os: linux, arch: mipsle, gomips: hardfloat, openwrt: "mipsel_24kc_24kf" }
          - { os: linux, arch: mipsle, gomips: softfloat }
          - { os: linux, arch: mips64, gomips: softfloat, openwrt: "mips64_mips64r2 mips64_octeonplus" }
          - { os: linux, arch: mips64le, gomips: hardfloat }
          - { os: linux, arch: mips64le, gomips: softfloat, openwrt: "mips64el_mips64r2" }
          - { os: linux, arch: s390x, debian: s390x, rpm: s390x }
          - { os: linux, arch: ppc64le, debian: ppc64el, rpm: ppc64le }
          - { os: linux, arch: riscv64 }
          - { os: linux, arch: loong64 }
    steps:
      - name: Checkout this repo (for pins.env)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1

      - name: Load pins
        run: |
          if [ -f ci/pins.env ]; then
            cat ci/pins.env | grep -E '^[A-Z]' >> "$GITHUB_ENV"
          else
            echo "Error: ci/pins.env not found"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false

      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-linux-

      - name: Clone cronet-go (if naive and not purego)
        if: matrix.naive && matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: matrix.naive && matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium toolchain
        if: matrix.naive && matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} download-toolchain
          fi

      - name: Set Chromium toolchain environment
        if: matrix.naive && matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env >> $GITHUB_ENV
          fi

      - name: Set tag (for reference)
        run: |
          git ls-remote --exit-code --tags origin "v${{ env.SING_BOX_VERSION }}" || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag "v${{ env.SING_BOX_VERSION }}" -f

      - name: Set build tags
        run: |
          set -xeuo pipefail
          if [[ "${{ matrix.naive }}" == "true" ]]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          else
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          fi
          if [[ "${{ matrix.variant }}" == "purego" ]]; then
            TAGS="${TAGS},with_purego"
          elif [[ "${{ matrix.variant }}" == "musl" ]]; then
            TAGS="${TAGS},with_musl"
          fi
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Set shared ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"

      - name: Build (purego)
        if: matrix.variant == 'purego'
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract libcronet.so (purego + naive)
        if: matrix.variant == 'purego' && matrix.naive
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          LIBRARY_PATH="lib/${{ matrix.os }}_${{ matrix.arch }}/libcronet.so"
          git init "$RUNNER_TEMP/cronet-go-lib"
          git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/

      - name: Build (glibc)
        if: matrix.variant == 'glibc'
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (musl)
        if: matrix.variant == 'musl'
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (non-variant)
        if: matrix.variant == ''
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set name
        run: |
          DIR_NAME="sing-box-${{ env.SING_BOX_VERSION }}-linux-${{ matrix.arch }}"
          if [[ -n "${{ matrix.goarm }}" ]]; then
            DIR_NAME="${DIR_NAME}v${{ matrix.goarm }}"
          elif [[ -n "${{ matrix.go386 }}" && "${{ matrix.go386 }}" != 'sse2' ]]; then
            DIR_NAME="${DIR_NAME}-${{ matrix.go386 }}"
          elif [[ -n "${{ matrix.gomips }}" && "${{ matrix.gomips }}" != 'hardfloat' ]]; then
            DIR_NAME="${DIR_NAME}-${{ matrix.gomips }}"
          fi
          if [[ "${{ matrix.variant }}" == "glibc" ]]; then
            DIR_NAME="${DIR_NAME}-glibc"
          elif [[ "${{ matrix.variant }}" == "musl" ]]; then
            DIR_NAME="${DIR_NAME}-musl"
          fi
          echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"
          PKG_VERSION="${{ env.SING_BOX_VERSION }}"
          PKG_VERSION="${PKG_VERSION//-/\~}"
          echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"

      - name: Package DEB
        if: matrix.debian != ''
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          sudo apt-get install -y debsigs
          cp .fpm_systemd .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ env.SING_BOX_VERSION }}_linux_${{ matrix.debian }}.deb" \
            --architecture ${{ matrix.debian }} \
            dist/sing-box=/usr/bin/sing-box
          rm -rf $HOME/.gnupg
          gpg --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --import <<EOF
          ${{ secrets.GPG_KEY }}
          EOF
          debsigs --sign=origin -k ${{ secrets.GPG_KEY_ID }} --gpgopts '--pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}"' dist/*.deb

      - name: Package RPM
        if: matrix.rpm != ''
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          echo '%_rpmformat 4' > "$HOME/.rpmmacros"
          cp .fpm_systemd .fpm
          fpm -t rpm \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ env.SING_BOX_VERSION }}_linux_${{ matrix.rpm }}.rpm" \
            --architecture ${{ matrix.rpm }} \
            dist/sing-box=/usr/bin/sing-box
          cat > $HOME/.rpmmacros <<EOF
          %_gpg_name ${{ secrets.GPG_KEY_ID }}
          %_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase ${{ secrets.GPG_PASSPHRASE }}
          EOF
          gpg --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --import <<EOF
          ${{ secrets.GPG_KEY }}
          EOF
          rpmsign --addsign dist/*.rpm

      - name: Package Pacman
        if: matrix.pacman != ''
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          sudo apt-get update || true
          sudo apt-get install -y libarchive-tools
          cp .fpm_pacman .fpm
          fpm -t pacman \
            -v "$PKG_VERSION" \
            -p "dist/sing-box_${{ env.SING_BOX_VERSION }}_linux_${{ matrix.pacman }}.pkg.tar.zst" \
            --architecture ${{ matrix.pacman }} \
            dist/sing-box=/usr/bin/sing-box

      - name: Package OpenWrt
        if: matrix.openwrt != ''
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          cp .fpm_openwrt .fpm
          fpm -t deb \
            -v "$PKG_VERSION" \
            -p "dist/openwrt.deb" \
            --architecture all \
            dist/sing-box=/usr/bin/sing-box
          for architecture in ${{ matrix.openwrt }}; do
            .github/deb2ipk.sh "$architecture" "dist/openwrt.deb" "dist/sing-box_${{ env.SING_BOX_VERSION }}_openwrt_${architecture}.ipk"
          done
          rm "dist/openwrt.deb"

      - name: Install apk-tools
        if: matrix.openwrt != '' || matrix.alpine != ''
        run: |
          docker run --rm -v /usr/local/bin:/mnt alpine:edge sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"

      - name: Package OpenWrt APK
        if: matrix.openwrt != ''
        run: |
          set -xeuo pipefail
          for architecture in ${{ matrix.openwrt }}; do
            .github/build_openwrt_apk.sh \
              "$architecture" \
              "${{ env.SING_BOX_VERSION }}" \
              "dist/sing-box" \
              "dist/sing-box_${{ env.SING_BOX_VERSION }}_openwrt_${architecture}.apk"
          done

      - name: Package Alpine APK
        if: matrix.alpine != ''
        run: |
          set -xeuo pipefail
          .github/build_alpine_apk.sh \
            "${{ matrix.alpine }}" \
            "${{ env.SING_BOX_VERSION }}" \
            "dist/sing-box" \
            "dist/sing-box_${{ env.SING_BOX_VERSION }}_linux_${{ matrix.alpine }}.apk"

      - name: Archive
        run: |
          set -xeuo pipefail
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          if [ -f libcronet.so ]; then
            cp libcronet.so "${DIR_NAME}"
          fi
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"

      - name: Cleanup
        run: rm -f dist/sing-box dist/libcronet.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux_${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}${{ matrix.go386 && format('_{0}', matrix.go386) }}${{ matrix.gomips && format('_{0}', matrix.gomips) }}${{ matrix.variant && format('-{0}', matrix.variant) }}
          path: "dist"

  # ==================== eBPF 构建（克隆外部仓库 CHIZI-0618/sing-box） ====================
  build-ebpf:
    name: Build eBPF binaries (amd64 & arm64) from external repo
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_ebpf == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for pins.env)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1

      - name: Load pins
        run: |
          if [ -f ci/pins.env ]; then
            cat ci/pins.env | grep -E '^[A-Z]' >> "$GITHUB_ENV"
          else
            echo "Error: ci/pins.env not found"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false

      - name: Clone external repo and checkout commit
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/reF1nd/sing-box repo
          git -C repo checkout "$SING_BOX_COMMIT"
          git -C repo submodule update --init --recursive || true

      - name: Build eBPF binaries
        run: |
          set -eux
          mkdir -p dist

          build_arch() {
            local arch=$1
            local output="dist/sing-box-${SING_BOX_VERSION}-linux-${arch}"
            (
              cd repo
              BASE_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
              export TAGS="${BASE_TAGS},with_ebpf"
              export CGO_ENABLED=0
              export GOOS=linux
              export GOARCH="$arch"
              make build
            )
            mv repo/sing-box "$output"
            tar -czf "${output}.tar.gz" -C dist "$(basename "$output")"
            rm "$output"
          }

          build_arch amd64
          build_arch arm64

      - name: Upload to release (sing-box-ebpf)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sing-box-ebpf --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create sing-box-ebpf --repo "${{ github.repository }}" \
              --title "sing-box eBPF binaries" \
              --notes "Auto-built sing-box binaries (eBPF-enabled, amd64/arm64)." \
              --latest=false

          for file in dist/*.tar.gz; do
            gh release upload sing-box-ebpf "$file" --repo "${{ github.repository }}" --clobber
          done

          # 只保留最近 3 个 assets
          gh release view sing-box-ebpf --repo "${{ github.repository }}" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[3:] | .[].name' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete-asset sing-box-ebpf "$old" --repo "${{ github.repository }}" -y
              done

  # ==================== Android 库构建 ====================
  build-android-lib:
    name: Build Android library (${{ matrix.go_arch }})
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build == 'All' || inputs.build == 'Android' || inputs.build == 'publish-android'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_arch:
          - "386"
          - amd64
          - arm
          - arm64
    steps:
      - name: Checkout this repo (for pins.env)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1

      - name: Load pins
        run: |
          if [ -f ci/pins.env ]; then
            cat ci/pins.env | grep -E '^[A-Z]' >> "$GITHUB_ENV"
          else
            echo "Error: ci/pins.env not found"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-linux-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set tag (for reference)
        run: |
          git ls-remote --exit-code --tags origin "v${{ env.SING_BOX_VERSION }}" || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag "v${{ env.SING_BOX_VERSION }}" -f

      - name: Build library
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
          mkdir -p dist/${{ matrix.go_arch }}
          mv libbox.aar libbox-legacy.aar dist/${{ matrix.go_arch }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-${{ matrix.go_arch }}
          path: dist
          compression-level: 0

  # ==================== Android 客户端构建 ====================
  build-android:
    name: Build Android (${{ matrix.variant }})
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.build == 'All' || inputs.build == 'Android'))
    runs-on: ubuntu-latest
    needs:
      - build-android-lib
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: other
            task: :app:assembleOtherRelease
            output: app/build/outputs/apk/other/release/*.apk
          - variant: other-legacy
            task: :app:assembleOtherLegacyRelease
            output: app/build/outputs/apk/otherLegacy/release/*.apk
    steps:
      - name: Checkout this repo (for pins.env)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1

      - name: Load pins
        run: |
          if [ -f ci/pins.env ]; then
            cat ci/pins.env | grep -E '^[A-Z]' >> "$GITHUB_ENV"
          else
            echo "Error: ci/pins.env not found"
            exit 1
          fi

      - name: Checkout Android client
        run: git submodule update --init clients/android

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false

      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-linux-

      - name: Cache Go tool builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-build-tools-linux-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set tag (for reference)
        run: |
          git ls-remote --exit-code --tags origin "v${{ env.SING_BOX_VERSION }}" || echo "PUBLISHED=false" >> "$GITHUB_ENV"
          git tag "v${{ env.SING_BOX_VERSION }}" -f

      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libbox-android-*
          path: libbox-inputs
          merge-multiple: true

      - name: Merge libraries
        run: |
          go run ./cmd/internal/merge_aar -output libbox.aar libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar -output libbox-legacy.aar libbox-inputs/*/libbox-legacy.aar

      - name: Checkout main branch
        if: github.ref == 'refs/heads/stable' && github.event_name != 'workflow_dispatch'
        run: |
          cd clients/android
          git checkout main

      - name: Checkout dev branch
        if: github.ref == 'refs/heads/testing'
        run: |
          cd clients/android
          git checkout dev

      - name: Checkout submodule recursive
        run: |
          cd clients/android
          git submodule update --init --recursive -v

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Update version (for dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          go run -v ./cmd/internal/update_android_version --ci

      - name: Update nightly version (for push)
        if: github.event_name != 'workflow_dispatch'
        run: |
          go run -v ./cmd/internal/update_android_version --ci --nightly

      - name: Build
        run: |
          mkdir -p clients/android/app/libs
          cp *.aar clients/android/app/libs
          cd clients/android
          ./gradlew --build-cache --parallel ${{ matrix.task }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Prepare upload
        run: |
          mkdir -p dist
          cp clients/android/${{ matrix.output }} dist
          VERSION_CODE=$(grep VERSION_CODE clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME clients/android/version.properties | cut -d= -f2)
          cat > dist/SFA-version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}"
          }
          EOF
          cat dist/SFA-version-metadata.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-android-apks-${{ matrix.variant }}
          path: 'dist'

  # ==================== 发布 Android 到 Google Play ====================
  publish-android:
    name: Publish Android
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'publish-android' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/testing')
